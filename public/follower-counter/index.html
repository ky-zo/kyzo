    :root {

    * { box-sizing: border-box; }

    html {
      overflow-x: hidden;
      background: var(--canvas);
    }

    body {
      min-width: 0;
      min-height: 100vh;

    .range-title {

      position: relative;
      height: 32px;
      margin: 0 1px;
    }

      position: absolute;

      left: 0;

      border-radius: 999px;
    }

    .slider-progress {

  <script>
    const NET = [-1,0,10,1,-1,3,2,2,2,5,-1,8,7,7,6,3,5,0,2,5,1,1,2,1,11,1,13,2,75,19,5,0,-1,-1,6,-1,-1,0,214,89,62,19,1,3,0,-6,11,-4,4,1,3,27,31,5,2,11,5,3,87,276,36,4,-1,2,1,76,100,42,53,22,5,2,53,8,34,25,8,4,2,2,3,14,6,1,-5,1,9,10,22,8,5,0,0,29,26,0,5,112,64,23,14,60,6,-4,1,0,2,0,8,1,-2,42,23,2,3,2,-2,15,13,15,5,5,85,166,95,32,12,20,6,3,53,11,3,-3,2,4,-3,0,-4,2,-3,1,-1,0,7,97,15,42,96,35,71,50,12,6,0,0,1,7,3,1,1,0,4,0,-2,2,7,-2,-1,0,-2,-1,-3,11,45,6,-1,0,-1,3,-3,-1,3,1,153,123,-3,29,3,-6,30,34,8,3,1,2,-1,0,-2,-3,1,0,2,-2,-4,-3,-1,-1,0,1,0,0,-1,25,2,0,115,40,8,2,8,20,2,14,8,7,0,11,5,7,2,17,23,12,17,7,7,70,13,5,10,12,1,-1,2,9,5,17,6,29,7,6,3,3,1,169,114,63,88,54,22,8,4,6,5,-3,2,3,4,2,3,-1,2,20,2,3,6,6,64,65,11,8,5,2,-3,1,2,-2,8,20,7,2,1,-1,0,-1,2,3,0,0,-1,1,-1,-5,1,0,2,-2,1,-3,3,-4,-1,0,0,125,23,15,3,6,13,4,-1,-1,-1,-3,1,1,0,0,1,13,3,4,4,3,1,5,7,4,6,2,3,24,8,95,1,2,2,4,2,7,4,-1,20,230,47,6,7,1,8,327,75,17,27];

    let CURRENT = 16435;
    const PERIODS = [
      {label:'7 days', days:7}, {label:'14 days', days:14},
      {label:'1 month', months:1}, {label:'2 months', months:2},
      {label:'3 months', months:3}, {label:'6 months', months:6},
      {label:'9 months', months:9}, {label:'12 months', months:12},
      {label:'2 years', years:2}, {label:'3 years', years:3},
      {label:'Since April 2023', all:true}
    ];

    const TYPEFULLY = [
      ['2023-11-30',250],['2023-12-31',273],['2024-01-31',314],
      ['2024-02-29',1054],['2024-03-31',1272],['2024-04-30',1538],
      ['2024-05-31',1688],['2024-06-30',2096],['2024-07-31',3130],
      ['2024-08-17',8583],['2024-08-31',8808],['2024-09-30',9649],
      ['2024-10-31',9761],['2024-11-30',9926],['2024-12-31',10196],
      ['2025-01-31',10191],['2025-02-28',10522],['2025-03-31',10616],
      ['2025-04-30',10694],['2025-05-31',10884],['2025-06-30',10868],
      ['2025-07-31',10891],['2025-08-16',10990],['2025-08-31',11030],
      ['2025-09-30',11537],['2025-10-31',12434],['2025-11-30',12447],
      ['2026-08-15',16435]
    ].map(([date,value])=>({
      date:new Date(date+'T12:00:00'), value, kind:'typefully', source:'Typefully',
      precision:'Exact export', note:'Retained follower snapshot', url:''
    }));

    const TWEET_EVIDENCE = [
      {date:'2023-08-11',value:132,precision:'Exact screenshot',note:'Analytics card shows Followers 132',url:'https://x.com/ky__zo/status/1689997869074247680'},
      {date:'2024-03-26',value:1200,precision:'Reported milestone',note:'“I hit 1200 followers today”',url:'https://x.com/ky__zo/status/1772614634215997904'},
      {date:'2024-06-29',value:2000,precision:'Reported milestone',note:'“celebrating 2000 followers”',url:'https://x.com/ky__zo/status/1806962133416165455'},
      {date:'2024-07-07',value:2731,precision:'Exact screenshot',note:'Archived Typefully chart shows 2,731',url:'https://x.com/ky__zo/status/1810184372491792529'},
      {date:'2024-12-28',value:10046,precision:'Exact screenshot',note:'Analytics card shows Followers 10,046',url:'https://x.com/ky__zo/status/1872979441367818379'},
      {date:'2025-10-21',value:12199,precision:'Exact screenshot',note:'Archived Typefully chart shows 12,199',url:'https://x.com/ky__zo/status/1980796834798059869'}
    ].map(point=>({...point,date:new Date(point.date+'T12:00:00'),kind:'tweet',source:'Tweet evidence'}));

    const HISTORY_START = new Date('2023-04-01T12:00:00');
    const START_POINT = {
      date:HISTORY_START, value:0, kind:'start', source:'Starting point',
      precision:'Baseline', note:'Follower history starts at zero', url:''
    };
    const OBSERVED = [START_POINT,...TYPEFULLY,...TWEET_EVIDENCE].sort((a,b)=>a.date-b.date);
    const X_DAILY = [];
    let xRunning = CURRENT - NET.reduce((sum,value)=>sum+value,0);
    X_DAILY.push({date:new Date('2025-08-15T12:00:00'),value:xRunning,kind:'x',source:'X daily net',precision:'Reconstructed'});
    NET.forEach((net,i)=>{
      const date=new Date('2025-08-16T12:00:00');
      date.setDate(date.getDate()+i);
      xRunning+=net;
      X_DAILY.push({date,value:xRunning,kind:'x',source:'X daily net',precision:'Reconstructed'});
    });

    const DAY = 86400000;
    const CALIBRATION_START = new Date('2025-08-16T12:00:00');

    function buildCanonicalHistory() {
      const xByDate=new Map(X_DAILY.map(point=>[point.date.getTime(),point.value]));
      const historical=OBSERVED.filter(point=>point.date<CALIBRATION_START);
      const anchors=OBSERVED.filter(point=>point.date>=CALIBRATION_START);
      const calibrated=[...historical];

      anchors.slice(0,-1).forEach((start,index)=>{
        const end=anchors[index+1];
        const days=Math.round((end.date-start.date)/DAY);
        const rawStart=xByDate.get(start.date.getTime());
        const rawEnd=xByDate.get(end.date.getTime());
        const observedChange=end.value-start.value;
        const rawChange=rawEnd-rawStart;
        const reconciliation=observedChange-rawChange;

        if(index===0) calibrated.push(start);
        for(let day=1;day<=days;day++) {
          const date=new Date(start.date);
          date.setDate(date.getDate()+day);
          if(day===days) {
            calibrated.push(end);
            continue;
          }
          const rawValue=xByDate.get(date.getTime());
          const progress=day/days;
          calibrated.push({
            date,
            value:Math.round(start.value+(rawValue-rawStart)+reconciliation*progress),
            kind:'canonical',
            source:'Canonical history',
            precision:'Daily movement between known counts'
          });
        }
      });

      return calibrated.sort((a,b)=>a.date-b.date);
    }

    let CANONICAL = buildCanonicalHistory();

    function historyFrom(cutoff) {
      const cutoffTime=cutoff instanceof Date?cutoff.getTime():cutoff;
      const firstVisible=CANONICAL.findIndex(point=>point.date.getTime()>=cutoffTime);
      if(firstVisible<0) return [CANONICAL.at(-1)];
      if(firstVisible===0||CANONICAL[firstVisible].date.getTime()===cutoffTime) return CANONICAL.slice(firstVisible);

      const previous=CANONICAL[firstVisible-1];
      const next=CANONICAL[firstVisible];
      const span=next.date.getTime()-previous.date.getTime();
      const progress=span?Math.max(0,Math.min(1,(cutoffTime-previous.date.getTime())/span)):0;
      const boundary={
        date:new Date(cutoffTime),
        value:Math.round(previous.value+(next.value-previous.value)*progress),
        kind:'boundary',
        source:'Range boundary',
        precision:'Interpolated between known counts'
      };
      return [boundary,...CANONICAL.slice(firstVisible)];
    }

    const svg = document.querySelector('#chart');
    const tooltip = document.querySelector('#tooltip');
    const periodLabel = document.querySelector('#periodLabel');
    const growthValue = document.querySelector('#growthValue');
    const rangeSlider = document.querySelector('#rangeSlider');
    const rangeControl = document.querySelector('#rangeControl');
    const sliderTrack = document.querySelector('#sliderTrack');
    const sliderProgress = document.querySelector('#sliderProgress');
    const sliderStops = [...document.querySelectorAll('.slider-stop')];
    const rangeValue = document.querySelector('#rangeValue');
    const fmt = new Intl.NumberFormat('en-US');
    let activePeriod = 2;
    let hits = [];
    let chartFrame = 0;
    let progressMotion = null;
    let displayedDomain = null;
    let hasRendered = false;
    let sliderPointerActive = false;
    let sliderPointerMoved = false;
    let sliderPointerStartX = 0;
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const SLIDER_CLICK_DURATION = 160;
    const SLIDER_DRAG_DURATION = 100;

    const short = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    const compact = n => n >= 1000 ? `${(n/1000).toFixed(n%1000 ? 1 : 0)}K` : fmt.format(n);
    const niceStep = value => {
      const power = 10 ** Math.floor(Math.log10(Math.max(1,value)));
      const scaled = value / power;
      return (scaled <= 1 ? 1 : scaled <= 2 ? 2 : scaled <= 5 ? 5 : 10) * power;
    };
    const niceStepDown = value => {
      const power = 10 ** Math.floor(Math.log10(Math.max(1,value)));
      const scaled = value / power;
      const factor = [1,2,2.5,5,10].filter(candidate=>candidate<=scaled).at(-1) || 1;
      return factor * power;
    };

    const SMOOTHING=.28;
    function geometryPath(points) {
      if(!points.length) return '';
      if(points.length===1) return `M${points[0].x.toFixed(1)},${points[0].y.toFixed(1)}`;
      const factor=SMOOTHING/6;
      let result=`M${points[0].x.toFixed(1)},${points[0].y.toFixed(1)}`;
      for(let index=0;index<points.length-1;index++) {
        const previous=points[Math.max(0,index-1)];
        const current=points[index];
        const next=points[index+1];
        const following=points[Math.min(points.length-1,index+2)];
        const minY=Math.min(current.y,next.y);
        const maxY=Math.max(current.y,next.y);
        const control1={
          x:current.x+(next.x-previous.x)*factor,
          y:Math.max(minY,Math.min(maxY,current.y+(next.y-previous.y)*factor))
        };
        const control2={
          x:next.x-(following.x-current.x)*factor,
          y:Math.max(minY,Math.min(maxY,next.y-(following.y-current.y)*factor))
        };
        result+=` C${control1.x.toFixed(1)},${control1.y.toFixed(1)} ${control2.x.toFixed(1)},${control2.y.toFixed(1)} ${next.x.toFixed(1)},${next.y.toFixed(1)}`;
      }
      return result;
    }
    const areaPath=(points,bottom)=>`${geometryPath(points)} L${points.at(-1).x.toFixed(1)},${bottom} L${points[0].x.toFixed(1)},${bottom} Z`;
    const easeInOutQuart=value=>value<.5?8*value**4:1-(-2*value+2)**4/2;

    function updateSliderPosition(index, animate=true, duration=SLIDER_CLICK_DURATION) {
      const ratio=index/(PERIODS.length-1);
      const thumbWidth=sliderThumb.offsetWidth||32;
      const distance=Math.max(0,sliderTrack.clientWidth-thumbWidth);
      const thumbCenter=thumbWidth/2+distance*ratio;
      const targetWidth=`${thumbCenter}px`;
      const shouldAnimate=animate&&hasRendered&&!reduceMotion;
      const currentWidth=getComputedStyle(sliderProgress).width;
      progressMotion?.cancel();
      sliderProgress.style.width=targetWidth;
      if(shouldAnimate) {
        const timing={duration,easing:'cubic-bezier(0.23, 1, 0.32, 1)'};
        progressMotion=sliderProgress.animate([{width:currentWidth},{width:targetWidth}],timing);
      }
      sliderStops.forEach((stop,stopIndex)=>stop.classList.toggle('active',stopIndex<=index));
    }

    function render(index=activePeriod, animateSlider=true, animateGraph=true, sliderDuration=SLIDER_CLICK_DURATION) {
      activePeriod=index;
      tooltip.classList.remove('visible');
      const period=PERIODS[index];
      const displayEnd=CANONICAL.at(-1).date;
      const cutoff=new Date(displayEnd);
      if(period.days) cutoff.setDate(cutoff.getDate()-(period.days-1));
      if(period.months) cutoff.setMonth(cutoff.getMonth()-period.months);
      if(period.years) cutoff.setFullYear(cutoff.getFullYear()-period.years);
      if(period.all) cutoff.setTime(HISTORY_START.getTime());

      const canonicalRaw=historyFrom(cutoff);
      const W=1040,H=380,m={t:21,r:62,b:47,l:2};
      const iw=W-m.l-m.r,ih=H-m.t-m.b;
      const values=canonicalRaw.map(p=>p.value);
      const min=Math.min(...values),max=Math.max(...values);
      const movement=Math.max(1,max-min);
      const tightRange=Boolean(period.days||period.months||period.years===2);
      let step,yMin,yMax,tickStart;
      if(tightRange) {
        const padding=Math.max(4,movement*.125);
        yMin=Math.max(0,min-padding);
        yMax=max+padding;
        step=niceStepDown((yMax-yMin)/4);
        yMax=Math.max(yMax,(Math.floor(max/step)+1)*step);
        tickStart=Math.ceil(yMin/step)*step;
      } else {
        const padding=Math.max(12,movement*.16,max*.011);
        step=niceStep((movement+padding*2)/4);
        yMin=Math.max(0,Math.floor((min-padding)/step)*step);
        yMax=Math.ceil((max+padding)/step)*step;
        tickStart=yMin;
      }
      if(yMax<=yMin) yMax=yMin+step;
      const targetDomain={cutoff:cutoff.getTime(),yMin,yMax};
      const fromDomain=displayedDomain?{...displayedDomain}:{...targetDomain};
      const projectHistory=domain=>{
        return historyFrom(domain.cutoff).map(point=>({
          ...point,
          x:m.l+(point.date.getTime()-domain.cutoff)/Math.max(1,displayEnd.getTime()-domain.cutoff)*iw,
          y:m.t+(1-(point.value-domain.yMin)/(domain.yMax-domain.yMin))*ih
        }));
      };
      const targetX=date=>m.l+(date.getTime()-targetDomain.cutoff)/Math.max(1,displayEnd.getTime()-targetDomain.cutoff)*iw;
      const targetY=value=>m.t+(1-(value-targetDomain.yMin)/(targetDomain.yMax-targetDomain.yMin))*ih;
      const canonicalHits=canonicalRaw.map(point=>({...point,x:targetX(point.date),y:targetY(point.value)}));
      hits=canonicalHits;
      const initialGeometry=projectHistory(fromDomain);
      const shouldZoom=hasRendered&&animateGraph&&!reduceMotion;
      const canonicalPath=initialGeometry.length>1?`<path id="linePath" class="observed-line" d="${geometryPath(initialGeometry)}"/>`:'';
      const canonicalArea=initialGeometry.length>1?`<path id="areaPath" class="observed-area" d="${areaPath(initialGeometry,m.t+ih)}"/>`:'';

      const ticks=[];
      for(let value=tickStart;value<=yMax+step*.001;value+=step) ticks.push(Number(value.toPrecision(12)));
      const labelCount=period.days?Math.min(period.days,7):(period.months&&period.months<=3)?6:7;
      const labels=Array.from({length:labelCount},(_,i)=>{
        const date=new Date(cutoff.getTime()+(displayEnd-cutoff)*i/(labelCount-1));
        return {date,x:m.l+iw*i/(labelCount-1)};
      });
      const labelText=date=>period.days||(period.months&&period.months<=3)
        ? date.toLocaleDateString('en-US',{month:'short',day:'numeric'})
        : period.months
          ? date.toLocaleDateString('en-US',{month:'short'})
          : date.toLocaleDateString('en-US',{month:'short',year:'2-digit'}).replace(' ',' ’');
      const tickMarkup=ticks.map(value=>{
        const y=targetY(value);
        const grid=Math.abs(y-m.t)>.5?`<line class="grid" x1="${m.l}" x2="${m.l+iw}" y1="${y}" y2="${y}"/>`:'';
        return `${grid}<text x="${m.l+iw+11}" y="${y+9}">${compact(value)}</text>`;
      }).join('');

      svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
      svg.setAttribute('aria-label',`${period.label} follower history ending ${short(displayEnd)}`);
      svg.innerHTML=`
        <defs>
          <linearGradient id="observedFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1597f4" stop-opacity=".105"/><stop offset="1" stop-color="#1597f4" stop-opacity=".006"/></linearGradient>
          <clipPath id="plotClip"><rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}"/></clipPath>
        </defs>
        <line id="topBoundary" class="plot-boundary" x1="${m.l}" x2="${m.l+iw}" y1="${m.t}" y2="${m.t}"/>
        ${tickMarkup}
        <g class="series" clip-path="url(#plotClip)">${canonicalArea}${canonicalPath}<g id="pointLayer" class="point-layer" style="opacity:${shouldZoom?0:1}"></g></g>
        <line class="base" x1="${m.l}" x2="${m.l+iw}" y1="${m.t+ih}" y2="${m.t+ih}"/>
        ${labels.map(label=>`<circle cx="${label.x}" cy="${m.t+ih+9}" r="3.3" fill="var(--rule-strong)"/><text x="${label.x}" y="${m.t+ih+33}" text-anchor="middle">${labelText(label.date)}</text>`).join('')}
        <line id="focusLine" class="focus-line" y1="${m.t}" y2="${m.t+ih}"/>
        <circle id="focusDot" class="focus" r="4.8"/>
        <rect id="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>
      `;

      const first=canonicalRaw[0];
      const growth=CURRENT-first.value;
      growthValue.textContent=`${growth>=0?'+':'−'}${Math.abs(growth)>=1000?(Math.abs(growth)/1000).toFixed(1)+'K':fmt.format(Math.abs(growth))}`;
      growthValue.style.color=growth>=0?'var(--green)':'var(--danger)';
      periodLabel.textContent=`${short(cutoff)} — ${short(displayEnd)}`;
      rangeValue.textContent=period.label;
      rangeSlider.value=index;
      updateSliderPosition(index,animateSlider,sliderDuration);
      document.querySelectorAll('.range').forEach((button,i)=>{
        const active=i===index;
        button.classList.toggle('active',active);
        button.setAttribute('aria-pressed',String(active));
      });

      const focusLine=document.querySelector('#focusLine');
      const focusDot=document.querySelector('#focusDot');
      const hit=document.querySelector('#hit');
      const line=document.querySelector('#linePath');
      const area=document.querySelector('#areaPath');
      const pointLayer=document.querySelector('#pointLayer');
      if(chartFrame) cancelAnimationFrame(chartFrame);

      if(shouldZoom&&line&&area) {
        hit.style.pointerEvents='none';
        const started=performance.now();
        const duration=260;
        const frame=now=>{
          const progress=Math.min(1,(now-started)/duration);
          const eased=easeInOutQuart(progress);
          displayedDomain={
            cutoff:fromDomain.cutoff+(targetDomain.cutoff-fromDomain.cutoff)*eased,
            yMin:fromDomain.yMin+(targetDomain.yMin-fromDomain.yMin)*eased,
            yMax:fromDomain.yMax+(targetDomain.yMax-fromDomain.yMax)*eased
          };
          const frameGeometry=projectHistory(displayedDomain);
          line.setAttribute('d',geometryPath(frameGeometry));
          area.setAttribute('d',areaPath(frameGeometry,m.t+ih));
          if(progress<1) {
            chartFrame=requestAnimationFrame(frame);
            return;
          }
          chartFrame=0;
          displayedDomain={...targetDomain};
          if(pointLayer) pointLayer.style.opacity='1';
          hit.style.pointerEvents='auto';
        };
        chartFrame=requestAnimationFrame(frame);
      } else {
        displayedDomain={...targetDomain};
        if(!hasRendered&&!reduceMotion&&line&&area) {
          const length=line.getTotalLength();
          line.animate([
            {strokeDasharray:length,strokeDashoffset:length},
            {strokeDasharray:length,strokeDashoffset:0}
          ],{duration:420,easing:'cubic-bezier(0.23, 1, 0.32, 1)'});
          area.animate([{opacity:0},{opacity:1}],{duration:320,easing:'cubic-bezier(0.23, 1, 0.32, 1)'});
        }
      }
      hasRendered=true;
      hit.addEventListener('pointermove',event=>{
        const rect=svg.getBoundingClientRect();
        const mx=(event.clientX-rect.left)/rect.width*W;
        const point=hits.reduce((best,candidate)=>Math.abs(candidate.x-mx)<Math.abs(best.x-mx)?candidate:best,hits[0]);
        focusLine.setAttribute('x1',point.x); focusLine.setAttribute('x2',point.x); focusLine.style.opacity=1;
        focusDot.setAttribute('cx',point.x); focusDot.setAttribute('cy',point.y); focusDot.style.opacity=1;
        tooltip.querySelector('.tooltip-date').textContent=short(point.date);
        tooltip.querySelector('.tooltip-entries').innerHTML=`<div class="tooltip-entry"><span class="tooltip-value">${fmt.format(point.value)}</span></div>`;
        const plotWidth=tooltip.parentElement?.clientWidth||rect.width;
        const tooltipHalf=(tooltip.offsetWidth||168)/2;
        const horizontalInset=Math.min(48,(tooltipHalf+4)/Math.max(1,plotWidth)*100);
        tooltip.style.left=`${Math.min(100-horizontalInset,Math.max(horizontalInset,point.x/W*100))}%`;
        tooltip.style.top=`${Math.min(94,Math.max(16,point.y/H*100))}%`;
        tooltip.classList.add('visible');
      });
      hit.addEventListener('pointerleave',()=>{
        focusLine.style.opacity=0; focusDot.style.opacity=0; tooltip.classList.remove('visible');
      });
    }

    rangeSlider.addEventListener('pointerdown',event=>{
      sliderPointerActive=true;
      sliderPointerMoved=false;
      sliderPointerStartX=event.clientX;
      rangeControl.dataset.dragging='true';
    });
    rangeSlider.addEventListener('pointermove',event=>{
      if(sliderPointerActive&&Math.abs(event.clientX-sliderPointerStartX)>2) sliderPointerMoved=true;
    });
    rangeSlider.addEventListener('pointerup',()=>{
      sliderPointerActive=false;
      sliderPointerMoved=false;
      rangeControl.dataset.dragging='false';
    });
    rangeSlider.addEventListener('pointercancel',()=>{
      sliderPointerActive=false;
      sliderPointerMoved=false;
      rangeControl.dataset.dragging='false';
      updateSliderPosition(activePeriod,false);
    });
    rangeSlider.addEventListener('input',()=>render(
      Number(rangeSlider.value),
      true,
      sliderPointerActive,
      sliderPointerMoved ? SLIDER_DRAG_DURATION : SLIDER_CLICK_DURATION
    ));
    document.querySelectorAll('.range').forEach(button=>button.addEventListener('click',event=>render(Number(button.dataset.index),true,event.detail!==0)));
    addEventListener('resize',()=>{updateSliderPosition(activePeriod,false);render(activePeriod,false,false);});

    async function loadLiveHistory() {
      const response=await fetch(`/api/followers?t=${Date.now()}`,{cache:'no-store'});
      if(!response.ok) throw new Error(`Follower history returned HTTP ${response.status}`);
      const history=await response.json();
      if(!Array.isArray(history.points)||!history.points.length||!Number.isFinite(history.currentFollowers)) {
        throw new Error('Follower history response was invalid');
      }
      CURRENT=history.currentFollowers;
      document.querySelector('#currentValue').textContent=fmt.format(CURRENT);
      CANONICAL=history.points.map(point=>({
        date:new Date(`${point.date}T12:00:00`),
        value:point.followers,
        kind:point.kind,
        source:point.source||'Follower history'
      })).sort((a,b)=>a.date-b.date);
    }

    loadLiveHistory().catch(error=>console.error('Using embedded follower history',error)).finally(()=>render());
  </script>
</body>
</html>
